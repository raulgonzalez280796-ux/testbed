# Models offered in the UI's model dropdown, per provider. Edit freely:
# the model field also accepts any model id as free text.
# "default" is preselected for new agents: a cheap model, so a first run costs little.
anthropic:
  default: claude-haiku-5-5
  models:
    - claude-opus-5-5
    - claude-sonnet-5-5
    - claude-haiku-5-5
    - claude-fable-5-1
openai:
  default: gpt-6-luna
  models:
    - gpt-6-astra
    - gpt-6.1-sol
    - gpt-6-sol
    - gpt-6-luna
    - gpt-5.6-terra
    - gpt-5.6-luna
    - gpt-5.4-mini
    - gpt-5-nano
gemini:
  default: gemini-3.5-flash-lite
  models:
    - gemini-4-argon
    - gemini-3.1-pro-preview
    - gemini-3.8-flash
    - gemini-3.6-flash
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
